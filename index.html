<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta
      name="description"
      content="DevOps Learning OS — a fully client-side DevOps learning dashboard: study planner, courses, topics, projects, notes, revision, streaks, analytics and an optional AI assistant."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>DevOps Learning OS</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('devops-os:theme');
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'dark';
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : theme;
          document.documentElement.classList.toggle('dark', resolved === 'dark');
          document.documentElement.dataset.theme = resolved;
        } catch (error) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      DevOps Learning OS requires JavaScript. All of your data is stored locally in your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
