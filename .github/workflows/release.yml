name: Release

# Cut a release by tagging a commit:
#
#   npm version patch          # or edit "version" in package.json, then commit
#   git push origin main
#   git tag v1.1.0
#   git push origin v1.1.0
#
# The tag must match `version` in package.json — that file is the single source
# of truth for what the app reports in Settings → Deployment.
# This workflow then validates, builds and publishes a GitHub Release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.1.0 (must match package.json)
        required: true
        type: string

permissions:
  contents: write # create the GitHub Release
  pages: write # publish the tagged build
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the generated release notes can list the commits.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A tag that disagrees with package.json would ship a build reporting the
      # wrong version, so fail loudly instead of deploying it.
      - name: Verify tag matches package.json
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG="${TAG_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Bump the version, commit, push, then re-tag."
            exit 1
          fi
          echo "Version v$PKG verified."

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Attach the version manifest
        run: |
          mkdir -p release-assets
          cp dist/version.json release-assets/version.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DevOps Learning OS v${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-assets/version.json
          body: |
            ## DevOps Learning OS ${{ github.event.inputs.tag || github.ref_name }}

            Static, client-side build — deployed automatically to GitHub Pages.

            - Version is read from `package.json` and injected at build time.
            - `dist/version.json` (attached) records the exact version, commit and build time.
            - Data lives in your browser only (IndexedDB + localStorage). No backend, no secrets.
